# Автоматическое создание и удаление схемы для тестов
spring.jpa.hibernate.ddl-auto=create-drop

# Включаем обратно, но только если у тебя НЕТ своих schema.sql.
# Если есть — Hibernate сам все создаст из Entity благодаря ddl-auto.
spring.sql.init.mode=never

spring.jpa.properties.hibernate.format_sql=true

# Логирование (оставляем для отладки)
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.transaction=INFO

# Настройки БД
spring.datasource.driver-class-name=org.h2.Driver
# Добавляем MODE=PostgreSQL и DB_CLOSE_DELAY=-1
# Это заставит H2 понимать синтаксис Postgres и не удалять базу между соединениями внутри одного теста
spring.datasource.url=jdbc:h2:mem:shareit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Указываем современный диалект (важно для Hibernate 6+)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect